[buildout]
extends =
    https://dist.plone.org/release/5.2.15/versions.cfg
    versions.cfg
parts =
    instance
    zeoserver
newest = false
# Every package is pinned: Plone 5.2.15's list and versions.cfg.
allow-picked-versions = false
eggs-directory = /opt/senaite/eggs
download-cache = /tmp/buildout-downloads

# The image replaces the generated zope.conf, wsgi.ini and zeo.conf with the
# files in etc/; the build user's inituser file is deleted.
[instance]
recipe = plone.recipe.zope2instance
user = admin:build
http-address = 8080
zeo-client = on
zeo-address = zeo:8100
shared-blob = off
eggs =
    Plone
    Pillow
    senaite.lims
    SenaiteHotfix20260602

[zeoserver]
recipe = plone.recipe.zeoserver
zeo-address = 8100
file-storage = /data/filestorage/Data.fs
blob-storage = /data/blobstorage
pack-keep-old = false

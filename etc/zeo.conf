# The ZEO server that holds SENAITE's database and files on /data.
<zeo>
  address 8100
  read-only false
  invalidation-queue-size 100
  pid-filename /var/cache/senaite/zeoserver.pid
</zeo>

<filestorage 1>
  path /data/filestorage/Data.fs
  blob-dir /data/blobstorage
  # Packing doesn't keep a copy of the old file.
  pack-keep-old false
</filestorage>

<eventlog>
  level info
  <logfile>
    path STDERR
    format %(asctime)s %(message)s
  </logfile>
</eventlog>

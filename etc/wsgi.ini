# SENAITE's web server. Requests go through Wodby's filter, which serves the
# site at the root of the domain, then to Zope.

[server:main]
paste.server_factory = plone.recipe.zope2instance:main
use = egg:plone.recipe.zope2instance#main
fast-listen = 0.0.0.0:8080
threads = 4
clear_untrusted_proxy_headers = false
max_request_body_size = 1073741824
asyncore_use_poll = false

[app:zope]
use = egg:Zope#main
zope_conf = /opt/senaite/parts/instance/etc/zope.conf

[filter:translogger]
use = egg:Paste#translogger
setup_console_handler = False

[filter:wodby]
use = call:wodby_senaite.vhm:filter_factory

[pipeline:main]
pipeline =
    translogger
    wodby
    egg:Zope#httpexceptions
    zope

[loggers]
keys = root, plone, waitress.queue, waitress, wsgi

[handlers]
keys = console, accesslog

[formatters]
keys = generic, message

[logger_root]
level = INFO
handlers = console

[logger_plone]
level = INFO
handlers = console
qualname = plone
propagate = 0

[logger_waitress.queue]
level = INFO
handlers = console
qualname = waitress.queue
propagate = 0

[logger_waitress]
level = INFO
handlers = console
qualname = waitress
propagate = 0

[logger_wsgi]
level = INFO
handlers = accesslog
qualname = wsgi
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_accesslog]
class = StreamHandler
args = (sys.stdout,)
level = INFO
formatter = message

[formatter_generic]
format = %(asctime)s %(levelname)-7.7s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

[formatter_message]
format = %(message)s

# Zope's configuration for a SENAITE client of the ZEO server. $(NAME) reads
# an environment variable; the image sets defaults for all of them.
%define INSTANCEHOME /opt/senaite/parts/instance
instancehome $INSTANCEHOME
%define CLIENTHOME /var/cache/senaite/instance
clienthome $CLIENTHOME

debug-mode off
security-policy-implementation C
verbose-security off
default-zpublisher-encoding utf-8

<environment>
    CHAMELEON_CACHE /var/cache/senaite/chameleon
</environment>

<zodb_db main>
    # Objects kept in memory per database connection (one per thread).
    cache-size $(ZODB_CACHE_SIZE)
    <zeoclient>
      server $(ZEO_ADDRESS)
      storage 1
      name zeostorage
      # Blobs come from the ZEO server and are cached here.
      blob-dir $(SENAITE_BLOB_CACHE)
      shared-blob-dir off
      blob-cache-size $(ZEO_BLOB_CACHE_SIZE)
      cache-size $(ZEO_CLIENT_CACHE_SIZE)
      read-only false
      read-only-fallback false
    </zeoclient>
    mount-point /
</zodb_db>

<zodb_db temporary>
    # Temporary storage database (for sessions)
    <temporarystorage>
      name temporary storage for sessioning
    </temporarystorage>
    mount-point /temp_folder
    container-class Products.TemporaryFolder.TemporaryContainer
</zodb_db>

python-check-interval 1000
